<style>
        @layer base {
            body { -webkit-tap-highlight-color: transparent; }
            .pt-safe { padding-top: env(safe-area-inset-top); }
            .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
        }
        ::-webkit-scrollbar { display: none; }
        .tap-active:active { transform: scale(0.96); opacity: 0.8; }
        .keypad-active:active { background-color: #f5f5f5; }
    </style>

    body {
      min-height: max(884px, 100dvh);

  </head>
<body class="bg-background text-on-surface font-body-md h-full flex flex-col overflow-hidden">
<!-- Fixed Header -->
<header class="w-full pt-safe bg-background/80 backdrop-blur-xl shrink-0 z-20">
<div class="h-14 flex items-center px-container-padding-mobile gap-4">
<a class="w-10 h-10 flex items-center justify-center rounded-lg hover:bg-surface-container transition-colors tap-active" href="{{DATA:SCREEN:SCREEN_15}}">
<span class="material-symbols-outlined text-on-surface text-[24px]">arrow_back</span>
</a>
<h1 class="font-headline-md text-xl text-on-surface">Add Transaction</h1>
<div class="ml-auto w-10 h-10 rounded-full bg-primary flex items-center justify-center tap-active shadow-md">
<a class="w-full h-full flex items-center justify-center" href="{{DATA:SCREEN:SCREEN_9}}">
<span class="material-symbols-outlined text-on-primary text-[20px]">person</span>
</a>
</div>
</div>
</header>
<main class="flex-1 flex flex-col overflow-hidden">
<div class="flex flex-col h-full">
<!-- Amount Display Section -->
<section class="flex flex-col items-center justify-center py-4 bg-background shrink-0">
<!-- Segmented Toggle -->
<div class="flex p-1 bg-surface-container-high rounded-lg mb-3 w-[260px] relative overflow-hidden" id="type-toggle">
<button class="flex-1 py-2 rounded-md font-label-md text-[11px] transition-all duration-300 z-10 bg-primary text-on-primary" id="btn-expense" onclick="updateType('expense')">
                        EXPENSE
                    </button>
<button class="flex-1 py-2 rounded-md font-label-md text-[11px] transition-all duration-300 z-10 text-on-surface-variant" id="btn-income" onclick="updateType('income')">
                        INCOME
                    </button>
<div class="absolute top-1 left-1 bottom-1 w-[calc(50%-4px)] bg-primary rounded-md transition-transform duration-300 ease-out" id="toggle-slider"></div>
</div>
<!-- Large Amount Input -->
<div class="flex flex-col items-center">
<span class="font-label-md text-[11px] text-on-surface-variant uppercase tracking-widest leading-none mb-1">Amount</span>
<div class="flex items-baseline gap-1">
<span class="font-data-mono text-3xl text-primary" id="currency-symbol">$</span>
<span class="font-data-mono text-4xl text-on-surface" id="display-amount">0.00</span>
</div>
</div>
</section>
<!-- Interactive Selection Form -->
<div class="flex-1 flex flex-col px-container-padding-mobile gap-4 py-2 overflow-hidden">
<!-- Wallet Selector -->
<div class="flex flex-col gap-2">
<h3 class="font-label-md text-[11px] text-on-surface-variant ml-1 uppercase tracking-wide">Payment Method</h3>
<div class="grid grid-cols-3 gap-3">
<button class="payment-btn flex flex-col items-center gap-1.5 p-3 bg-primary text-on-primary shadow-sm rounded-lg transition-all tap-active" onclick="selectPayment(this)">
<span class="material-symbols-outlined text-[20px]">account_balance_wallet</span>
<span class="font-label-md text-[10px] text-center leading-tight uppercase">MAIN</span>
</button>
<button class="payment-btn flex flex-col items-center gap-1.5 p-3 bg-white border border-outline text-on-surface-variant shadow-sm rounded-lg transition-all tap-active" onclick="selectPayment(this)">
<span class="material-symbols-outlined text-[20px]">credit_card</span>
<span class="font-label-md text-[10px] text-center leading-tight uppercase">SAVINGS</span>
</button>
<button class="payment-btn flex flex-col items-center gap-1.5 p-3 bg-white border border-outline text-on-surface-variant shadow-sm rounded-lg transition-all tap-active" onclick="selectPayment(this)">
<span class="material-symbols-outlined text-[20px]">payments</span>
<span class="font-label-md text-[10px] text-center leading-tight uppercase">CASH</span>
</button>
</div>
</div>
<!-- Category Grid -->
<div class="flex flex-col gap-2">
<div class="flex justify-between items-center ml-1">
<h3 class="font-label-md text-[11px] text-on-surface-variant uppercase tracking-wide">Category</h3>
<button class="text-primary font-label-md text-[11px] tap-active">SEE ALL</button>
</div>
<div class="grid grid-cols-4 gap-3">
<button class="category-btn group flex flex-col items-center gap-1 p-2 bg-white border border-outline rounded-lg shadow-sm tap-active transition-all" data-category="Food">
<div class="w-9 h-9 rounded-full bg-surface-container-high flex items-center justify-center text-on-surface-variant group-[.active]:bg-primary group-[.active]:text-on-primary transition-colors">
<span class="material-symbols-outlined text-[20px]">restaurant</span>
</div>
<span class="font-label-md text-[9px] text-on-surface-variant group-[.active]:text-primary uppercase mt-1">FOOD</span>
</button>
<button class="category-btn group flex flex-col items-center gap-1 p-2 bg-white border border-outline rounded-lg shadow-sm tap-active transition-all" data-category="Shopping">
<div class="w-9 h-9 rounded-full bg-surface-container-high flex items-center justify-center text-on-surface-variant group-[.active]:bg-primary group-[.active]:text-on-primary transition-colors">
<span class="material-symbols-outlined text-[20px]">shopping_bag</span>
</div>
<span class="font-label-md text-[9px] text-on-surface-variant group-[.active]:text-primary uppercase mt-1">SHOP</span>
</button>
<button class="category-btn group flex flex-col items-center gap-1 p-2 bg-white border border-outline rounded-lg shadow-sm tap-active transition-all active" data-category="Transport">
<div class="w-9 h-9 rounded-full bg-primary flex items-center justify-center text-on-primary transition-colors">
<span class="material-symbols-outlined text-[20px]">directions_car</span>
</div>
<span class="font-label-md text-[9px] text-primary uppercase mt-1">TRANS</span>
</button>
<button class="category-btn group flex flex-col items-center gap-1 p-2 bg-white border border-outline rounded-lg shadow-sm tap-active transition-all" data-category="Entertainment">
<div class="w-9 h-9 rounded-full bg-surface-container-high flex items-center justify-center text-on-surface-variant group-[.active]:bg-primary group-[.active]:text-on-primary transition-colors">
<span class="material-symbols-outlined text-[20px]">theater_comedy</span>
</div>
<span class="font-label-md text-[9px] text-on-surface-variant group-[.active]:text-primary uppercase mt-1">ENT.</span>
</button>
</div>
</div>
<!-- Date & Settings -->
<div class="grid grid-cols-2 gap-3">
<div class="flex items-center gap-3 p-3 bg-white border border-outline rounded-lg tap-active">
<span class="material-symbols-outlined text-primary text-[18px]">calendar_today</span>
<span class="font-label-md text-[12px] text-on-surface">Today</span>
</div>
<div class="flex items-center justify-between p-3 bg-white border border-outline rounded-lg">
<span class="font-label-md text-[12px] text-on-surface">Monthly</span>
<label class="relative inline-flex items-center cursor-pointer">
<input class="sr-only peer" type="checkbox"/>
<div class="w-9 h-5 bg-surface-container-highest peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-primary"></div>
</label>
</div>
</div>
<!-- Numeric Keypad (Compressed for Zero Scroll) -->
<div class="mt-auto grid grid-cols-3 gap-2 bg-surface-container-low p-3 rounded-xl border border-outline/50 mb-2">
<button class="h-11 bg-white text-on-surface rounded-lg font-data-mono text-xl border border-outline shadow-sm keypad-active transition-colors" onclick="appendNumber('1')">1</button>
<button class="h-11 bg-white text-on-surface rounded-lg font-data-mono text-xl border border-outline shadow-sm keypad-active transition-colors" onclick="appendNumber('2')">2</button>
<button class="h-11 bg-white text-on-surface rounded-lg font-data-mono text-xl border border-outline shadow-sm keypad-active transition-colors" onclick="appendNumber('3')">3</button>
<button class="h-11 bg-white text-on-surface rounded-lg font-data-mono text-xl border border-outline shadow-sm keypad-active transition-colors" onclick="appendNumber('4')">4</button>
<button class="h-11 bg-white text-on-surface rounded-lg font-data-mono text-xl border border-outline shadow-sm keypad-active transition-colors" onclick="appendNumber('5')">5</button>
<button class="h-11 bg-white text-on-surface rounded-lg font-data-mono text-xl border border-outline shadow-sm keypad-active transition-colors" onclick="appendNumber('6')">6</button>
<button class="h-11 bg-white text-on-surface rounded-lg font-data-mono text-xl border border-outline shadow-sm keypad-active transition-colors" onclick="appendNumber('7')">7</button>
<button class="h-11 bg-white text-on-surface rounded-lg font-data-mono text-xl border border-outline shadow-sm keypad-active transition-colors" onclick="appendNumber('8')">8</button>
<button class="h-11 bg-white text-on-surface rounded-lg font-data-mono text-xl border border-outline shadow-sm keypad-active transition-colors" onclick="appendNumber('9')">9</button>
<button class="h-11 bg-white text-on-surface rounded-lg font-data-mono text-xl border border-outline shadow-sm keypad-active transition-colors" onclick="appendNumber('.')">.</button>
<button class="h-11 bg-white text-on-surface rounded-lg font-data-mono text-xl border border-outline shadow-sm keypad-active transition-colors" onclick="appendNumber('0')">0</button>
<button class="h-11 bg-white text-on-surface rounded-lg font-data-mono text-xl border border-outline shadow-sm keypad-active flex items-center justify-center transition-colors" onclick="deleteNumber()">
<span class="material-symbols-outlined text-[20px]">backspace</span>
</button>
</div>
<!-- Save Button -->
<div class="pb-safe shrink-0 mb-4">
<a class="flex items-center justify-center gap-2 bg-primary text-on-primary h-14 rounded-lg shadow-lg active:scale-[0.98] transition-transform w-full" href="{{DATA:SCREEN:SCREEN_2}}" id="save-btn">
<span class="material-symbols-outlined text-[22px] font-bold">check_circle</span>
<span class="font-label-md text-[14px] font-bold uppercase tracking-wider">Save Transaction</span>
</a>
</div>
</div>
</div>
</main>
<script>
        let currentAmount = "0.00";
        let isIncome = false;

        function updateType(type) {
            const slider = document.getElementById('toggle-slider');
            const btnExp = document.getElementById('btn-expense');
            const btnInc = document.getElementById('btn-income');
            
            if (type === 'income') {
                isIncome = true;
                slider.style.transform = 'translateX(100%)';
                btnInc.classList.add('text-on-primary');
                btnInc.classList.remove('text-on-surface-variant');
                btnExp.classList.remove('bg-primary', 'text-on-primary');
                btnExp.classList.add('text-on-surface-variant');
            } else {
                isIncome = false;
                slider.style.transform = 'translateX(0)';
                btnExp.classList.add('bg-primary', 'text-on-primary');
                btnExp.classList.remove('text-on-surface-variant');
                btnInc.classList.remove('text-on-primary');
                btnInc.classList.add('text-on-surface-variant');
            }
        }

        function appendNumber(num) {
            const display = document.getElementById('display-amount');
            if (currentAmount === "0.00") {
                currentAmount = num === "." ? "0." : num;
            } else {
                if (num === "." && currentAmount.includes(".")) return;
                if (currentAmount.includes(".") && currentAmount.split(".")[1].length >= 2) return;
                currentAmount += num;
            }
            display.innerText = currentAmount;
        }

        function deleteNumber() {
            const display = document.getElementById('display-amount');
            if (currentAmount.length > 1 && currentAmount !== "0.00") {
                currentAmount = currentAmount.slice(0, -1);
                if (currentAmount === "") currentAmount = "0.00";
            } else {
                currentAmount = "0.00";
            }
            display.innerText = currentAmount;
        }

        function selectPayment(btn) {
            document.querySelectorAll('.payment-btn').forEach(b => {
                b.classList.remove('bg-primary', 'text-on-primary');
                b.classList.add('bg-white', 'border', 'border-outline', 'text-on-surface-variant');
            });
            btn.classList.remove('bg-white', 'border', 'border-outline', 'text-on-surface-variant');
            btn.classList.add('bg-primary', 'text-on-primary');
        }

        document.querySelectorAll('.category-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.category-btn').forEach(b => {
                    b.classList.remove('active');
                    const inner = b.querySelector('.w-9');
                    const text = b.querySelector('span:last-child');
                    inner.className = 'w-9 h-9 rounded-full bg-surface-container-high flex items-center justify-center text-on-surface-variant transition-colors';
                    text.className = 'font-label-md text-[9px] text-on-surface-variant uppercase mt-1';
                });
                
                btn.classList.add('active');
                const inner = btn.querySelector('.w-9');
                const text = btn.querySelector('span:last-child');
                
                inner.className = 'w-9 h-9 rounded-full bg-primary flex items-center justify-center text-on-primary transition-colors';
                text.className = 'font-label-md text-[9px] text-primary uppercase mt-1';
            });
        });
    </script>
</body></html>
