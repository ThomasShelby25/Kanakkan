<style>
    @layer base {
      body {
        overscroll-behavior: none;
      }
      .pt-safe {
        padding-top: env(safe-area-inset-top, 0px);
      }
      .pb-safe {
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
    }
    body {
      min-height: 100dvh;
    }
    input:focus {
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-background pt-safe pb-safe overflow-hidden h-screen text-on-surface">
<main class="h-full flex flex-col items-center justify-center relative overflow-hidden px-margin-mobile">
<!-- Decorative Background Elements -->
<div class="absolute -top-24 -right-24 w-64 h-64 bg-primary/5 rounded-full blur-3xl pointer-events-none"></div>
<div class="absolute top-48 -left-32 w-48 h-48 bg-secondary/5 rounded-full blur-2xl pointer-events-none"></div>
<div class="w-full max-w-sm flex flex-col justify-between py-md h-full max-h-[812px]">
<!-- Logo Section -->
<div class="flex flex-col items-center animate-in fade-in slide-in-from-bottom-4 duration-700">
<div class="w-16 h-16 mb-6 flex items-center justify-center bg-surface-container-lowest rounded-xl shadow-sm">
<img alt="SalaryOS Logo" class="w-10 h-10 object-contain" src="https://lh3.googleusercontent.com/aida/AP1WRLtcjjtqb0R9w6IjxmFkJZ6grzaouNd5Bh2mRwtNUPtGR_ra6D37IgGcpHqI8czlVzXjIILOjcUtSaeKDnZp_WykZKipX_ifLSi2U0iwj22n8XoTMCRB-VLEsxCbCNDAdHYRZaXf03f4szWAo0sQLRqHeCXMsuffuKpq_ygN9uvyH2PsdNWy6bi6OosAlcoWvIvfSA6qy7w3_ZJz9Jd8HG48FRQfHRuXPBnxJf51iAEy14NbilbIIDnkJRE"/>
</div>
<h1 class="font-headline-lg-mobile text-on-surface mb-2">Welcome back</h1>
<p class="font-body-sm text-secondary text-center max-w-[240px]">Log in to manage your salary and expenses</p>
</div>
<!-- Login Form -->
<form class="space-y-4 animate-in fade-in slide-in-from-bottom-8 duration-700 delay-150 flex-grow flex flex-col justify-center" id="loginForm">
<!-- Email Field -->
<div class="space-y-1.5">
<label class="font-label-md text-secondary ml-1">Email Address</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-[20px] text-secondary group-focus-within:text-primary transition-colors duration-200">mail</span>
<input class="w-full h-12 pl-11 pr-4 bg-white border border-outline focus:border-primary focus:ring-1 focus:ring-primary rounded-lg font-body-md text-on-surface outline-none transition-all duration-200" placeholder="name@company.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-1.5">
<label class="font-label-md text-secondary ml-1">Password</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-[20px] text-secondary group-focus-within:text-primary transition-colors duration-200">lock</span>
<input class="w-full h-12 pl-11 pr-11 bg-white border border-outline focus:border-primary focus:ring-1 focus:ring-primary rounded-lg font-body-md text-on-surface outline-none transition-all duration-200" id="passwordInput" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-secondary hover:text-on-surface p-1 focus:outline-none" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined text-[20px]" id="passwordToggleIcon">visibility</span>
</button>
</div>
</div>
<!-- Actions Row -->
<div class="flex items-center justify-between py-1">
<label class="flex items-center space-x-2 cursor-pointer group">
<div class="relative flex items-center justify-center">
<input class="peer appearance-none w-4 h-4 border border-outline rounded bg-white checked:bg-primary checked:border-primary transition-all cursor-pointer" type="checkbox"/>
<span class="material-symbols-outlined absolute text-[12px] text-on-primary opacity-0 peer-checked:opacity-100 transition-opacity pointer-events-none">check</span>
</div>
<span class="font-body-sm text-on-surface">Remember me</span>
</label>
<a class="font-body-sm text-primary font-semibold hover:underline" href="#">Forgot password?</a>
</div>
<!-- CTA Button -->
<a class="w-full h-12 bg-primary text-on-primary rounded-lg font-headline-sm shadow-md active:scale-[0.98] transition-transform flex items-center justify-center space-x-2 mt-4 overflow-hidden relative group" href="{{DATA:SCREEN:SCREEN_10}}">
<div class="absolute inset-0 bg-white/10 translate-y-full group-hover:translate-y-0 transition-transform duration-300"></div>
<span class="relative z-10">Log In</span>
</a>
<!-- Divider -->
<div class="flex items-center py-4 animate-in fade-in duration-700 delay-300">
<div class="flex-1 h-[1px] bg-outline/40"></div>
<span class="px-4 font-label-md text-secondary">or continue with</span>
<div class="flex-1 h-[1px] bg-outline/40"></div>
</div>
<!-- Social Logins -->
<div class="grid grid-cols-2 gap-3 animate-in fade-in slide-in-from-bottom-4 duration-700 delay-500">
<button class="flex items-center justify-center h-12 bg-white border border-outline rounded-lg font-body-sm text-on-surface hover:bg-surface-container-low transition-colors space-x-2 shadow-sm">
<svg class="w-4 h-4" viewbox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="currentColor"></path><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="currentColor"></path><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="currentColor"></path><path d="M12 5.38c1.62 0 3.06.56 4.21 1.66l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 12-4.53z" fill="currentColor"></path></svg>
<span class="">Google</span>
</button>
<button class="flex items-center justify-center h-12 bg-white border border-outline rounded-lg font-body-sm text-on-surface hover:bg-surface-container-low transition-colors space-x-2 shadow-sm">
<svg class="w-4 h-4" viewbox="0 0 24 24"><path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C4.38 16.94 4.54 10.3 8.1 10.3c1.02 0 1.83.43 2.45.43.59 0 1.66-.5 2.83-.41 1.25.09 2.22.56 2.89 1.55-2.45 1.45-1.85 4.58.58 5.56-.47 1.15-1.07 2.15-1.8 2.85zM12.03 10.15c-.02-2.11 1.73-3.9 3.73-4.13.23 2.44-2.18 4.29-3.73 4.13z" fill="currentColor"></path></svg>
<span class="">Apple</span>
</button>
</div>
</form>
<!-- Footer -->
<div class="text-center animate-in fade-in duration-1000 delay-700 mt-6 mb-2">
<p class="font-body-sm text-secondary">
          Don't have an account? 
          <a class="text-primary font-bold ml-1 hover:underline" href="{{DATA:SCREEN:SCREEN_2}}">Sign up</a>
</p>
</div>
</div>
</main>
<script>
    function togglePassword() {
      const input = document.getElementById('passwordInput');
      const icon = document.getElementById('passwordToggleIcon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.innerText = 'visibility_off';
      } else {
        input.type = 'password';
        icon.innerText = 'visibility';
      }
    }

    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const btn = e.target.querySelector('a');
      const originalContent = btn.innerHTML;
      
      btn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span>';
      btn.style.opacity = '0.8';
      
      setTimeout(() => {
        btn.innerHTML = originalContent;
        btn.style.opacity = '1';
      }, 1500);
    });

    window.addEventListener('mousemove', (e) => {
      const blobs = document.querySelectorAll('.blur-3xl, .blur-2xl');
      const x = (e.clientX / window.innerWidth) - 0.5;
      const y = (e.clientY / window.innerHeight) - 0.5;
      
      blobs.forEach((blob, i) => {
        const speed = (i + 1) * 15;
        blob.style.transform = `translate(${x * speed}px, ${y * speed}px)`;
      });
    });
  </script>
</body></html>
