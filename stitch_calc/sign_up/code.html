 "body-sm": ["Inter"], "body-lg": ["Inter"], "headline-sm": ["Hanken Grotesk"], "label-md": ["Inter"], "headline-lg-mobile": ["Hanken Grotesk"], "headline-md": ["Hanken Grotesk"], "body-md": ["Inter"], "label-caps": ["Inter"], "display-lg-mobile": ["Hanken Grotesk"], "data-mono": ["JetBrains Mono"]}, fontSize: {"headline-lg": ["32px", {lineHeight: "40px", letterSpacing: "-0.01em", fontWeight: "600"}], "display-lg": ["48px", {lineHeight: "56px", letterSpacing: "-0.02em", fontWeight: "700"}], "body-sm": ["14px", {lineHeight: "20px", fontWeight: "400"}], "body-lg": ["18px", {lineHeight: "28px", fontWeight: "400"}], "headline-sm": ["20px", {lineHeight: "28px", fontWeight: "600"}], "label-md": ["12px", {lineHeight: "16px", letterSpacing: "0.05em", fontWeight: "600"}], "headline-lg-mobile": ["28px", {lineHeight: "36px", fontWeight: "600"}], "headline-md": ["24px", {lineHeight: "32px", fontWeight: "600"}], "body-md": ["16px", {lineHeight: "24px", fontWeight: "400"}], "label-caps": ["12px", {lineHeight: "16px", letterSpacing: "0.05em", fontWeight: "600"}], "display-lg-mobile": ["32px", {lineHeight: "40px", letterSpacing: "-0.02em", fontWeight: "700"}], "data-mono": ["14px", {lineHeight: "20px", fontWeight: "500"}]}, keyframes: {"fade-in-up": {"0%": {opacity: "0", transform: "translateY(10px)"}, "100%": {opacity: "1", transform: "translateY(0)"}}}, animation: {"fade-in-up": "fade-in-up 0.4s ease-out forwards"}}}};</script>
<style>
        @layer base {
            body { overscroll-behavior: none; overflow: hidden; height: 100vh; }
            .pt-safe { padding-top: env(safe-area-inset-top, 0px); }
            .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); }
        }
        .form-stagger > * {
            opacity: 0;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-background pt-safe pb-safe overflow-hidden h-screen text-on-background">
<main class="h-full flex flex-col">
<div class="flex flex-col w-full px-container-padding-mobile h-full justify-between pb-2">
<!-- Header Section -->
<div class="flex flex-col items-center justify-center mt-6 mb-4 text-center animate-fade-in-up" style="animation-delay: 0.1s">
<img alt="SalaryOS Logo" class="h-10 w-auto mb-4" src="https://lh3.googleusercontent.com/aida/AP1WRLtcjjtqb0R9w6IjxmFkJZ6grzaouNd5Bh2mRwtNUPtGR_ra6D37IgGcpHqI8czlVzXjIILOjcUtSaeKDnZp_WykZKipX_ifLSi2U0iwj22n8XoTMCRB-VLEsxCbCNDAdHYRZaXf03f4szWAo0sQLRqHeCXMsuffuKpq_ygN9uvyH2PsdNWy6bi6OosAlcoWvIvfSA6qy7w3_ZJz9Jd8HG48FRQfHRuXPBnxJf51iAEy14NbilbIIDnkJRE"/>
<h1 class="font-headline-lg-mobile text-on-surface mb-1">Create Account</h1>
<p class="font-body-md text-sm text-secondary max-w-[280px]">
                Join SalaryOS to start managing your finances with ease.
            </p>
</div>
<!-- Registration Form -->
<form class="flex flex-col gap-3 form-stagger" onsubmit="event.preventDefault();">
<!-- Full Name -->
<div class="relative group animate-fade-in-up" style="animation-delay: 0.2s">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-secondary group-focus-within:text-primary transition-colors text-[20px]">person</span>
<input class="w-full h-[48px] pl-12 pr-4 bg-white text-on-surface font-body-md rounded-lg outline-none border border-outline focus:border-primary focus:ring-1 focus:ring-primary transition-all shadow-sm text-sm" placeholder="Full Name" required="" type="text"/>
</div>
<!-- Email Address -->
<div class="relative group animate-fade-in-up" style="animation-delay: 0.25s">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-secondary group-focus-within:text-primary transition-colors text-[20px]">mail</span>
<input class="w-full h-[48px] pl-12 pr-4 bg-white text-on-surface font-body-md rounded-lg outline-none border border-outline focus:border-primary focus:ring-1 focus:ring-primary transition-all shadow-sm text-sm" placeholder="Email Address" required="" type="email"/>
</div>
<!-- Password -->
<div class="relative group animate-fade-in-up" style="animation-delay: 0.3s">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-secondary group-focus-within:text-primary transition-colors text-[20px]">lock</span>
<input class="w-full h-[48px] pl-12 pr-12 bg-white text-on-surface font-body-md rounded-lg outline-none border border-outline focus:border-primary focus:ring-1 focus:ring-primary transition-all shadow-sm text-sm" id="password-input" placeholder="Password" required="" type="password"/>
<button class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-secondary cursor-pointer hover:text-on-surface transition-colors text-[20px]" onclick="const p = document.getElementById('password-input'); p.type = p.type === 'password' ? 'text' : 'password'; this.textContent = p.type === 'password' ? 'visibility' : 'visibility_off';" type="button">visibility</button>
</div>
<!-- Confirm Password -->
<div class="relative group animate-fade-in-up" style="animation-delay: 0.35s">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-secondary group-focus-within:text-primary transition-colors text-[20px]">lock</span>
<input class="w-full h-[48px] pl-12 pr-4 bg-white text-on-surface font-body-md rounded-lg outline-none border border-outline focus:border-primary focus:ring-1 focus:ring-primary transition-all shadow-sm text-sm" placeholder="Confirm Password" required="" type="password"/>
</div>
<!-- Terms Checkbox -->
<div class="flex items-start gap-3 px-1 animate-fade-in-up" style="animation-delay: 0.4s">
<div class="relative flex items-center">
<input class="peer appearance-none w-5 h-5 rounded border border-outline bg-white checked:bg-primary checked:border-primary cursor-pointer transition-all" id="terms" type="checkbox"/>
<span class="material-symbols-outlined absolute text-[16px] text-on-primary opacity-0 peer-checked:opacity-100 left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 pointer-events-none">check</span>
</div>
<label class="font-body-md text-xs text-secondary leading-tight" for="terms">
                    I agree to the <a class="text-primary font-semibold" href="#">Terms</a> and <a class="text-primary font-semibold" href="#">Privacy</a>
</label>
</div>
<!-- Primary CTA -->
<button class="w-full h-[52px] bg-primary text-on-primary font-headline-sm rounded-lg shadow-sm hover:shadow-md active:scale-[0.98] transition-all mt-1 animate-fade-in-up" style="animation-delay: 0.45s">
                Create Account
            </button>
</form>
<!-- Divider -->
<div class="flex items-center gap-4 my-2 animate-fade-in-up" style="animation-delay: 0.5s">
<div class="h-[1px] flex-1 bg-outline"></div>
<span class="font-label-caps text-secondary uppercase tracking-widest">or sign up with</span>
<div class="h-[1px] flex-1 bg-outline"></div>
</div>
<!-- Social Sign Up -->
<div class="grid grid-cols-2 gap-4 mb-2 animate-fade-in-up" style="animation-delay: 0.55s">
<button class="flex items-center justify-center gap-2 h-[48px] bg-white rounded-lg border border-outline hover:bg-surface-container-low transition-colors">
<svg class="w-4 h-4" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
<span class="font-body-md text-sm text-on-surface">Google</span>
</button>
<button class="flex items-center justify-center gap-2 h-[48px] bg-white rounded-lg border border-outline hover:bg-surface-container-low transition-colors">
<svg class="w-4 h-4 fill-current text-on-surface" viewbox="0 0 24 24">
<path d="M17.05 20.28c-.96.95-2.22 1.78-3.32 1.78-1.28 0-1.87-.79-3.46-.79-1.61 0-2.28.78-3.41.78-1.07 0-2.31-.83-3.3-1.81-2.14-2.11-3.64-6.07-3.64-9.35 0-5.15 3.19-7.87 6.22-7.87 1.25 0 2.22.56 2.92.56.71 0 1.95-.62 3.33-.62 1.48 0 4.14.67 5.51 3.13-3.23 1.54-2.71 5.86.53 7.31-1.06 2.53-2.31 4.77-3.38 5.88zM12.03 3.86c-.05-1.92 1.22-3.6 2.76-3.86.13 1.93-1.24 3.73-2.76 3.86z"></path>
</svg>
<span class="font-body-md text-sm text-on-surface">Apple</span>
</button>
</div>
<!-- Bottom Link -->
<div class="mt-auto pb-4 text-center animate-fade-in-up" style="animation-delay: 0.6s">
<p class="font-body-md text-sm text-secondary">
                Already have an account? 
                <a class="text-primary font-semibold ml-1" href="{{DATA:SCREEN:SCREEN_4}}">Sign in</a>
</p>
</div>
</div>
</main>
<script>
    document.querySelectorAll('input').forEach(input => {
        input.addEventListener('focus', () => {
            input.parentElement.classList.add('scale-[1.01]');
        });
        input.addEventListener('blur', () => {
            input.parentElement.classList.remove('scale-[1.01]');
        });
    });
</script>
</body></html>
